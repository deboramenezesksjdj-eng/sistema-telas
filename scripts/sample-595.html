<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KYC - Mantenha-se Parado</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            background: transparent !important; /* Fundo totalmente transparente para a câmera */
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centraliza o conteúdo principal */
            padding: 20px;
        }

        /* CABEÇALHO FIXO NO TOPO */
        .header {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .logo {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 2px 10px rgba(0, 180, 216, 0.4));
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: #00b4d8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* CONTAINER CENTRAL (ANEL + INSTRUÇÃO) */
        .kyc-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 60px; /* Compensa visualmente o espaço do cabeçalho */
        }

        /* ANEL CIRCULAR DA CÂMERA */
        .camera-ring {
            width: min(75vw, 320px);
            height: min(75vw, 320px);
            border: 6px solid #ffffff; 
            border-radius: 50%; 
            background: transparent; 
            
            /* Animação de Foco Fixo: Altera apenas a cor e o brilho (Glow) */
            animation: focoEstavel 2s infinite ease-in-out;
        }

        @keyframes focoEstavel {
            0%, 100% { 
                border-color: rgba(255, 255, 255, 0.6);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), inset 0 4px 20px rgba(0, 0, 0, 0.15);
            }
            50% { 
                border-color: #00b4d8; /* Fica azulzinho indicando leitura ativa */
                box-shadow: 0 0 20px rgba(0, 180, 216, 0.6), inset 0 0 20px rgba(0, 180, 216, 0.6);
            }
        }

        /* TEXTO DO COMANDO */
        .command-text {
            font-size: 22px;
            font-weight: 500;
            color: #ffffff; 
            text-align: center;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); /* Sombra forte para leitura sobre a câmera */
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="logo" src="https://kzxjhxctcmualiaufkqx.supabase.co/storage/v1/object/public/joystick-logos/4decaa4e-c8bc-41ab-9761-c91e90b7ff34.webp" alt="Logo MPA">
        <div class="header-title">Confirmação de Identidade</div>
    </div>

    <div class="kyc-container">
        <div class="camera-ring"></div>
        <div class="command-text">Mantenha-se parado</div>
    </div>

</body>
</html>
