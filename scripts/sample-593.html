<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KYC - Frente do Documento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            background: transparent !important; /* Fundo totalmente transparente */
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Mantém a moldura no centro geométrico da tela */
            padding: 20px;
        }

        /* CABEÇALHO FIXO NO TOPO */
        .header {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .logo {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 2px 10px rgba(0, 180, 216, 0.4));
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: #00b4d8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* CONTAINER CENTRAL (MOLDURA + INSTRUÇÃO) */
        .kyc-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 60px; /* Compensa visualmente o espaço do cabeçalho */
            width: 100%;
        }

        /* MOLDURA RETANGULAR DO DOCUMENTO */
        .document-frame {
            width: min(85vw, 340px);
            height: min(55vw, 220px); /* Proporção aproximada de um RG/CNH */
            border: 4px solid #ffffff; 
            border-radius: 16px; /* Cantos arredondados padrão de documentos */
            background: transparent; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), inset 0 4px 20px rgba(0, 0, 0, 0.15); /* Sombra para profundidade */
            
            /* Animação de escaneamento/foco */
            animation: focoDocumento 2.5s infinite ease-in-out;
        }

        @keyframes focoDocumento {
            0%, 100% { transform: scale(0.98); opacity: 0.8; border-color: rgba(255, 255, 255, 0.8); }
            50% { transform: scale(1.02); opacity: 1; border-color: #90e0ef; box-shadow: 0 0 15px rgba(0, 180, 216, 0.5), inset 0 0 15px rgba(0, 180, 216, 0.3); }
        }

        /* TEXTO DO COMANDO */
        .command-text {
            font-size: 22px;
            font-weight: 500;
            color: #ffffff; 
            text-align: center;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); 
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="logo" src="https://kzxjhxctcmualiaufkqx.supabase.co/storage/v1/object/public/joystick-logos/4decaa4e-c8bc-41ab-9761-c91e90b7ff34.webp" alt="Logo MPA">
        <div class="header-title">Confirmação de Identidade</div>
    </div>

    <div class="kyc-container">
        <div class="document-frame"></div>
        <div class="command-text">Afaste a câmera.</div>
    </div>

</body>
</html>
