<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KYC - Mova para a esquerda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            background: transparent !important; /* Fundo totalmente transparente para a câmera */
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centraliza o conteúdo principal */
            padding: 20px;
        }

        /* CABEÇALHO FIXO NO TOPO */
        .header {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .logo {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 2px 10px rgba(0, 180, 216, 0.4));
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: #00b4d8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* CONTAINER CENTRAL */
        .kyc-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 60px; /* Compensa visualmente o espaço do cabeçalho */
        }

        /* ARO DA CÂMERA ESTÁTICO */
        .camera-ring {
            width: min(75vw, 320px);
            height: min(75vw, 320px);
            border: 6px solid #ffffff; 
            border-radius: 50%; 
            background: transparent; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), inset 0 4px 20px rgba(0, 0, 0, 0.15); /* Sombras para profundidade */
        }

        /* CONTAINER DO TEXTO E DA SETA */
        .instruction-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
        }

        /* TEXTO DO COMANDO */
        .command-text {
            font-size: 22px;
            font-weight: 500;
            color: #ffffff; 
            text-align: center;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); /* Sombra forte para leitura sobre a câmera */
        }

        /* SETA DIRECIONAL E ANIMAÇÃO PARA A ESQUERDA */
        .arrow-icon {
            width: 45px;
            height: 45px;
            color: #ffffff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8));
            animation: moverEsquerda 1.5s infinite ease-in-out;
        }

        @keyframes moverEsquerda {
            0%, 100% { transform: translateX(0); opacity: 0.5; }
            50% { transform: translateX(-20px); opacity: 1; } /* Movimento negativo no eixo X (esquerda) */
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="logo" src="https://kzxjhxctcmualiaufkqx.supabase.co/storage/v1/object/public/joystick-logos/4decaa4e-c8bc-41ab-9761-c91e90b7ff34.webp" alt="Logo MPA">
        <div class="header-title">Confirmação de Identidade</div>
    </div>

    <div class="kyc-container">
        <div class="camera-ring"></div>

        <div class="instruction-container">
            <div class="command-text">Mova para a esquerda</div>
            
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H8V8l-6 4 6 4v-3h12z"/>
            </svg>
        </div>
    </div>

</body>
</html>
